name: refresh-universe-catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "20 21 * * *"  # 06:20 KST

permissions:
  contents: write

concurrency:
  group: refresh-universe-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KIS_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build complete listed-company catalog
        run: python build_universe_catalog.py --force-refresh
      - name: Validate catalog
        run: python validate_universe_catalog.py
      - name: Commit catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest/universe.json
          if git diff --cached --quiet; then
            echo "No universe catalog changes."
            exit 0
          fi
          git commit -m "chore: refresh listed-company catalog [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
