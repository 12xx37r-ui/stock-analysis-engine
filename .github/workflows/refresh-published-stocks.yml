name: refresh-published-stocks

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "갱신할 기존 엔진 캐시 최대 종목 수"
        required: true
        default: "20"
        type: string
  schedule:
    - cron: "40 21 * * 1-5"  # 평일 06:40 KST

permissions:
  contents: write

concurrency:
  group: refresh-published-stocks
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KIS_DISABLED: "1"
      LIMIT: ${{ inputs.limit || '20' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate valuation contract v3
        run: python validate_valuation_contract.py
      - name: Refresh existing background cache
        run: python refresh_published_stocks.py --limit "$LIMIT"
      - name: Commit refreshed cache
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest/index.json data/latest/stocks
          if git diff --cached --quiet; then
            echo "No background-cache changes."
            exit 0
          fi
          git commit -m "chore: refresh published stock cache [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"
