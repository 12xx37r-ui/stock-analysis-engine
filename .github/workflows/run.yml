name: run-engine

on:
  workflow_dispatch:


jobs:

  run:

    runs-on: ubuntu-latest


    env:

      DART_API_KEY: ${{ secrets.DART_API_KEY }}

      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}

      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}


    steps:


      - name: Checkout

        uses: actions/checkout@v4


      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      - name: Check Secrets

        run: |

          if [ -z "$KIS_APP_KEY" ]; then

            echo "KIS_APP_KEY 없음"

          else

            echo "KIS_APP_KEY 있음"

          fi


          if [ -z "$KIS_APP_SECRET" ]; then

            echo "KIS_APP_SECRET 없음"

          else

            echo "KIS_APP_SECRET 있음"

          fi


      - name: Install

        run: |

          pip install -r requirements.txt


      - name: Run python

        run: |

          python main.py
