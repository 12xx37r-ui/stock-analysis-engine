name: Stock Analysis Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"


jobs:

  run-engine:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"


    - name: Install packages
      run:
        pip install -r requirements.txt


    - name: Run engine
      env:
        DART_API_KEY: ${{ secrets.DART_API_KEY }}
      run:
        python main.py
