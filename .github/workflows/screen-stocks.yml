name: screen-stocks

on:
  workflow_dispatch:
    inputs:
      stock_codes:
        description: "6자리 종목코드 목록 — 쉼표로 구분"
        required: true
        default: "005930,000660"
        type: string
      industry_code:
        description: "산업분석 코드"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - semiconductor
          - electronic_components
          - automotive
          - battery
          - biotechnology
          - construction
          - finance
          - insurance
          - none

permissions:
  contents: write

concurrency:
  group: forward-test-store
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest

    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_DISABLED: "0"
      KIS_TOKEN_FILE: ".cache/kis_token.json"
      KIS_TOKEN_REUSE_HOURS: "23"
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      STOCK_CODES: ${{ inputs.stock_codes }}
      INDUSTRY_CODE: ${{ inputs.industry_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Verify KIS credentials and enable collection
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KIS_APP_KEY:-}" || -z "${KIS_APP_SECRET:-}" ]]; then
            echo "::error::KIS_APP_KEY 또는 KIS_APP_SECRET이 이 워크플로에 전달되지 않았습니다."
            echo "::error::키가 저장되어 있다면 Repository secrets인지, Environment secrets라면 job에 environment가 지정됐는지 확인하십시오."
            exit 1
          fi
          echo "KIS credentials detected: collection is forced ON (KIS_DISABLED=0)."
          echo "The token is issued once per batch and reused for all stocks in this run."
      - name: Build weekly cache key
        id: cache-date
        shell: bash
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache OpenDART company list
        uses: actions/cache@v5
        with:
          path: .cache/dart_corp_codes.json
          key: dart-corp-codes-${{ runner.os }}-${{ steps.cache-date.outputs.week }}
          restore-keys: |
            dart-corp-codes-${{ runner.os }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate industry profiles
        run: |
          python validate_industry_profiles.py
      - name: Validate valuation profiles
        run: python validate_valuation_profiles.py
      - name: Validate valuation contract v4
        run: python validate_valuation_contract.py
      - name: Validate valuation data pipeline v4
        run: python validate_valuation_pipeline_v4.py
      - name: Validate insurance financials
        run: python validate_insurance_financials.py
      - name: Validate future growth valuation model
        run: python validate_future_growth_model.py
      - name: Validate signal bridge
        run: python validate_signal_bridge.py

      - name: Run screener
        run: |
          python screener.py \
            --stock-codes "$STOCK_CODES" \
            --industry-code "$INDUSTRY_CODE"

      - name: Validate screener output
        run: |
          python validate_screener.py \
            --stock-codes "$STOCK_CODES"

      - name: Record and evaluate forward tests
        run: |
          python forward_test.py \
            --screener-file output/screener.json \
            --store data/forward_tests.json \
            --report output/forward_test_report.json

      - name: Validate forward tests
        run: |
          python validate_forward_test.py \
            --store data/forward_tests.json \
            --report output/forward_test_report.json

      - name: Build calibration report
        run: |
          python calibration_monitor.py \
            --store data/forward_tests.json \
            --report output/calibration_report.json

      - name: Validate calibration report
        run: |
          python validate_calibration_report.py \
            --report output/calibration_report.json

      - name: Commit forward test store
        shell: bash
        run: |
          if git diff --quiet -- data/forward_tests.json; then
            echo "No forward-test store changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/forward_tests.json
          git commit -m "chore: update forward-test records [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload screener results
        uses: actions/upload-artifact@v5
        with:
          name: stock-screener-${{ github.run_number }}
          path: |
            output/screener.json
            output/screener.csv
            output/forward_test_report.json
            output/calibration_report.json
            output/*.json
          if-no-files-found: error
          retention-days: 30
