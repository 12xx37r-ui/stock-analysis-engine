name: weekly-forward-sampling

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "실행할 산업 배치"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - semiconductor
          - electronic_components
          - automotive
          - battery
          - biotechnology
          - construction
          - finance
  schedule:
    - cron: "30 7 * * 5"

permissions:
  contents: write

concurrency:
  group: forward-test-store
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_DISABLED: "0"
      KIS_TOKEN_FILE: ".cache/kis_token.json"
      KIS_TOKEN_REUSE_HOURS: "23"
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      SAMPLE_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.batch || 'all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Verify KIS credentials and enable collection
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KIS_APP_KEY:-}" || -z "${KIS_APP_SECRET:-}" ]]; then
            echo "::error::KIS_APP_KEY 또는 KIS_APP_SECRET이 이 워크플로에 전달되지 않았습니다."
            echo "::error::키가 저장되어 있다면 Repository secrets인지, Environment secrets라면 job에 environment가 지정됐는지 확인하십시오."
            exit 1
          fi
          echo "KIS credentials detected: collection is forced ON (KIS_DISABLED=0)."
          echo "The token is issued once per batch and reused for all stocks in this run."
      - name: Build weekly cache key
        id: cache-date
        shell: bash
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache OpenDART company list
        uses: actions/cache@v5
        with:
          path: .cache/dart_corp_codes.json
          key: dart-corp-codes-${{ runner.os }}-${{ steps.cache-date.outputs.week }}
          restore-keys: |
            dart-corp-codes-${{ runner.os }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate industry profiles
        run: |
          python validate_industry_profiles.py
      - name: Validate valuation profiles
        run: python validate_valuation_profiles.py
      - name: Validate valuation contract v4
        run: python validate_valuation_contract.py
      - name: Validate valuation data pipeline v4
        run: python validate_valuation_pipeline_v4.py
      - name: Validate signal bridge
        run: python validate_signal_bridge.py

      - name: Validate sampling plan
        run: |
          python validate_sampling_plan.py \
            --plan data/sampling_plan.json

      - name: Run weekly sampling
        run: |
          python weekly_sampler.py \
            --plan data/sampling_plan.json \
            --batch "$SAMPLE_BATCH"

      - name: Commit forward test store and latest engine feed
        shell: bash
        run: |
          CHANGES="$(git status --porcelain -- data/forward_tests.json data/latest)"

          if [ -z "$CHANGES" ]; then
            echo "No forward-test or latest-feed changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/forward_tests.json data/latest
          git commit -m "chore: publish latest engine feed [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload weekly sampling results
        uses: actions/upload-artifact@v5
        with:
          name: weekly-forward-sampling-${{ github.run_number }}
          path: |
            output/weekly_sampling_summary.json
            output/forward_test_report.json
            output/calibration_report.json
            output/weekly_sampling/**
            data/latest/index.json
            data/latest/forward_test_report.json
            data/latest/calibration_report.json
          if-no-files-found: error
          retention-days: 90
