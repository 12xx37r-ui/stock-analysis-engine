name: weekly-forward-sampling

on:
  workflow_dispatch:
    inputs:
      batch:
        description: "실행할 산업 배치"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - semiconductor
          - automotive
          - battery
          - biotechnology
          - construction
          - finance
  schedule:
    - cron: "30 7 * * 5"

permissions:
  contents: write

concurrency:
  group: forward-test-store
  cancel-in-progress: false

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      SAMPLE_BATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.batch || 'all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Build weekly cache key
        id: cache-date
        shell: bash
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache OpenDART company list
        uses: actions/cache@v5
        with:
          path: .cache/dart_corp_codes.json
          key: dart-corp-codes-${{ runner.os }}-${{ steps.cache-date.outputs.week }}
          restore-keys: |
            dart-corp-codes-${{ runner.os }}-

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate industry profiles
        run: |
          python validate_industry_profiles.py

      - name: Validate sampling plan
        run: |
          python validate_sampling_plan.py \
            --plan data/sampling_plan.json

      - name: Run weekly sampling
        run: |
          python weekly_sampler.py \
            --plan data/sampling_plan.json \
            --batch "$SAMPLE_BATCH"

      - name: Commit forward test store
        shell: bash
        run: |
          if git diff --quiet -- data/forward_tests.json; then
            echo "No forward-test store changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/forward_tests.json
          git commit -m "chore: weekly forward sampling [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload weekly sampling results
        uses: actions/upload-artifact@v5
        with:
          name: weekly-forward-sampling-${{ github.run_number }}
          path: |
            output/weekly_sampling_summary.json
            output/forward_test_report.json
            output/calibration_report.json
            output/weekly_sampling/**
          if-no-files-found: error
          retention-days: 90
