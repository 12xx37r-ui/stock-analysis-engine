name: on-demand-stock-analysis (admin cache)
on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: "6자리 종목코드"
        required: true
        type: string
      industry_code:
        description: "산업코드"
        required: true
        default: "auto"
        type: string
permissions:
  contents: write
concurrency:
  group: published-stock-feed
  cancel-in-progress: false
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_DISABLED: "0"
      KIS_TOKEN_FILE: ".cache/kis_token.json"
      KIS_TOKEN_REUSE_HOURS: "23"
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      STOCK_CODE: ${{ inputs.stock_code }}
      INDUSTRY_CODE: ${{ inputs.industry_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate input
        shell: bash
        run: |
          if [[ ! "$STOCK_CODE" =~ ^[0-9]{6}$ ]]; then
            echo "Invalid stock code: $STOCK_CODE"
            exit 1
          fi
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Verify KIS credentials and enable collection
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KIS_APP_KEY:-}" || -z "${KIS_APP_SECRET:-}" ]]; then
            echo "::error::KIS_APP_KEY 또는 KIS_APP_SECRET이 이 워크플로에 전달되지 않았습니다."
            echo "::error::키가 저장되어 있다면 Repository secrets인지, Environment secrets라면 job에 environment가 지정됐는지 확인하십시오."
            exit 1
          fi
          echo "KIS credentials detected: collection is forced ON (KIS_DISABLED=0)."
          echo "The token is issued once per batch and reused for all stocks in this run."
      - name: Build weekly cache key
        id: cache-date
        shell: bash
        run: |
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Cache OpenDART responses
        uses: actions/cache@v5
        with:
          path: |
            .cache/dart_corp_codes.json
            .cache/dart_api
          key: dart-api-${{ runner.os }}-${{ steps.cache-date.outputs.day }}-${{ github.run_id }}
          restore-keys: |
            dart-api-${{ runner.os }}-${{ steps.cache-date.outputs.day }}-
            dart-api-${{ runner.os }}-
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate industry profiles
        run: python validate_industry_profiles.py
      - name: Validate valuation profiles
        run: python validate_valuation_profiles.py
      - name: Validate valuation contract v4
        run: python validate_valuation_contract.py
      - name: Validate valuation data pipeline v4
        run: python validate_valuation_pipeline_v4.py
      - name: Validate published cache coherence
        run: python validate_cache_coherence.py
      - name: Validate signal bridge
        run: python validate_signal_bridge.py
      - name: Invalidate local target output
        shell: bash
        run: |
          rm -f "output/${STOCK_CODE}.json"
          echo "Local output cache invalidated: output/${STOCK_CODE}.json"
      - name: Run engine with OpenDART retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            echo "ENGINE ATTEMPT ${attempt}/2"
            rm -f "output/${STOCK_CODE}.json"
            python main.py --stock-code "$STOCK_CODE" --industry-code "$INDUSTRY_CODE"
            if python validate_dart_usable.py --file "output/${STOCK_CODE}.json" --stock-code "$STOCK_CODE"; then
              echo "OpenDART financial data usable on attempt ${attempt}."
              break
            fi
            if [[ "$attempt" == "2" ]]; then
              echo "::error::OpenDART 재무자료를 2회 모두 확보하지 못했습니다. 기존 정상 게시파일은 덮어쓰지 않습니다."
              exit 1
            fi
            echo "OpenDART temporary failure. Waiting 35 seconds before retry."
            sleep 35
          done
      - name: Validate output
        run: |
          python validate_output.py --file "output/${STOCK_CODE}.json" --stock-code "$STOCK_CODE"
          python validate_dart_usable.py --file "output/${STOCK_CODE}.json" --stock-code "$STOCK_CODE"
      - name: Publish latest engine feed
        run: |
          python publish_on_demand.py --stock-file "output/${STOCK_CODE}.json" --latest-root data/latest
          python validate_published_feed.py --file "data/latest/stocks/${STOCK_CODE}.json" --stock-code "$STOCK_CODE"
          python build_valuation_audit.py --latest-root data/latest
          python validate_latest_index.py --latest-root data/latest
      - name: Commit latest stock with retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/latest/stocks/${STOCK_CODE}.json" data/latest/index.json data/latest/valuation_audit.json
          if git diff --cached --quiet; then
            echo "No latest-feed changes."
          else
            git commit -m "feat: publish ${STOCK_CODE} on-demand engine [skip ci]"
          fi

          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME" || {
              git rebase --abort || true
              echo "Rebase failed on attempt $attempt"
              exit 1
            }
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Latest feed pushed on attempt $attempt"
              break
            fi
            if [[ "$attempt" == "3" ]]; then
              echo "Latest feed push failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 3))
          done
      - name: Verify committed feed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$GITHUB_REF_NAME"
          git show "origin/${GITHUB_REF_NAME}:data/latest/stocks/${STOCK_CODE}.json" > "/tmp/${STOCK_CODE}.published.json"
          python validate_published_feed.py --file "/tmp/${STOCK_CODE}.published.json" --stock-code "$STOCK_CODE"
          python - <<'PY'
          import hashlib, os, pathlib
          code = os.environ["STOCK_CODE"]
          local = pathlib.Path(f"data/latest/stocks/{code}.json").read_bytes()
          remote = pathlib.Path(f"/tmp/{code}.published.json").read_bytes()
          if hashlib.sha256(local).hexdigest() != hashlib.sha256(remote).hexdigest():
              raise SystemExit("Published feed checksum mismatch")
          print("Published feed checksum verified")
          PY
      - name: Upload result
        uses: actions/upload-artifact@v5
        with:
          name: on-demand-stock-${{ inputs.stock_code }}
          path: |
            output/${{ inputs.stock_code }}.json
            data/latest/index.json
            data/latest/valuation_audit.json
            data/latest/stocks/${{ inputs.stock_code }}.json
          if-no-files-found: error
          retention-days: 30
