name: on-demand-stock-analysis (GAS central KIS token)

run-name: on-demand-${{ inputs.stock_code }}-${{ inputs.request_id }}-${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      stock_code:
        description: "6자리 종목코드"
        required: true
        type: string
      industry_code:
        description: "산업코드"
        required: true
        default: "auto"
        type: string
      request_id:
        description: "GAS 요청 ID"
        required: false
        default: "manual"
        type: string


permissions:
  contents: write
  actions: read


concurrency:
  group: on-demand-stock-analysis
  cancel-in-progress: true


jobs:

  analyze:

    name: Analyze ${{ inputs.stock_code }}

    runs-on: ubuntu-latest

    timeout-minutes: 30


    env:

      STOCK_CODE: ${{ inputs.stock_code }}

      INDUSTRY_CODE: ${{ inputs.industry_code }}

      REQUEST_ID: ${{ inputs.request_id }}

      DART_API_KEY: ${{ secrets.DART_API_KEY }}

      KIS_DISABLED: "1"



    steps:


      - name: Checkout

        uses: actions/checkout@v4

        with:
          fetch-depth: 0



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      # 중요 추가
      - name: Install requirements

        shell: bash

        run: |

          set -euxo pipefail


          python -m pip install --upgrade pip


          python -m pip install \
            requests \
            pandas \
            numpy \
            beautifulsoup4 \
            python-dotenv \
            pykrx


          python - <<'PY'

          import requests
          import pandas
          import numpy

          print("DEPENDENCY CHECK PASS")
          print("requests:", requests.__version__)

          PY




      - name: Confirm KIS mode

        run: |

          echo "KIS_DISABLED=${KIS_DISABLED}"

          echo "GAS owns KIS token"



      - name: Prepare output

        run: |

          mkdir -p output

          rm -f output/${STOCK_CODE}.json




      - name: Run general company engine

        shell: bash

        run: |

          set +e


          echo "GENERAL COMPANY ENGINE"
          echo "request ${REQUEST_ID}"


          python main.py \
            --stock-code "$STOCK_CODE" \
            --industry-code "$INDUSTRY_CODE"


          STATUS=$?


          set -e



          if [ "$STATUS" != "0" ]; then

            echo "::warning::engine exit ${STATUS}"

          fi



          test -f output/${STOCK_CODE}.json



          python - <<PY

          import json

          p="output/${STOCK_CODE}.json"

          with open(p,encoding="utf-8") as f:

              d=json.load(f)


          print("OUTPUT VALID")

          print(d.get("기업명"))

          print(d.get("종목코드"))

          PY




      - name: Upload result

        uses: actions/upload-artifact@v4

        with:

          name: analysis-${{ inputs.stock_code }}

          path: output/${{ inputs.stock_code }}.json

          retention-days: 1





  publish:


    name: Publish ${{ inputs.stock_code }}


    needs: analyze


    runs-on: ubuntu-latest



    env:

      STOCK_CODE: ${{ inputs.stock_code }}



    steps:


      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Install publish requirements

        run: |

          python -m pip install --upgrade pip

          python -m pip install requests pandas numpy beautifulsoup4 python-dotenv pykrx



      - name: Download result

        uses: actions/download-artifact@v4

        with:

          name: analysis-${{ inputs.stock_code }}

          path: /tmp/result



      - name: Publish

        shell: bash

        run: |

          set -euxo pipefail


          mkdir -p data/latest/stocks


          cp \
          /tmp/result/${STOCK_CODE}.json \
          data/latest/stocks/${STOCK_CODE}.json



          python publish_on_demand.py \
          --stock-file data/latest/stocks/${STOCK_CODE}.json \
          --latest-root data/latest



          python validate_published_feed.py \
          --file data/latest/stocks/${STOCK_CODE}.json \
          --stock-code ${STOCK_CODE}



          git config user.name github-actions[bot]

          git config user.email 41898282+github-actions[bot]@users.noreply.github.com


          git add data/latest


          git commit \
          -m "publish ${STOCK_CODE} general lookup [skip ci]" \
          || true



          git push origin HEAD:${GITHUB_REF_NAME} || true




      - name: Verify feed

        run: |

          test -f data/latest/stocks/${STOCK_CODE}.json


          python - <<PY

          import json

          p="data/latest/stocks/${STOCK_CODE}.json"

          d=json.load(open(p,encoding="utf-8"))

          print("FEED OK")

          print(d.get("기업명"))

          PY
